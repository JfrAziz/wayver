[package]
name = "wayver"
version = "0.1.0"
edition = "2021"

[lib]
name = "wayver"
crate-type = ["cdylib"]

[dependencies]
android_logger = "0.14"
ash = "0.38"
jni = "0.21"
libc = "0.2"
libloading = "0.8"
log = "0.4"
ndk-sys = "0.6"
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-server = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
